[General]
# Background image. Any path readable by the sddm user works.
background=background

# How strongly the background is dimmed behind the form (0.0 - 1.0)
dimOpacity=0.62

# Background blur strength (0.0 - 1.0), mirrors hyprlock's blur_passes
blurAmount=0.75

# Palette — mirrors ~/.config/hypr/hyprlock.conf and waybar/style.css
colorBg=#111826
colorBgAlt=#182545
colorFg=#dddddd
colorAccent=#82dccc
colorAccent2=#01ccff
colorMuted=#798bb2
colorCrit=#ff5555

fontFamily=JetBrainsMono Nerd Font
clockSize=110
dateSize=22
