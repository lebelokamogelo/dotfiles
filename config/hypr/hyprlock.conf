general {
    hide_cursor       = true
    ignore_empty_input = true
    grace             = 0
}

background {
    monitor        =
    path           = /usr/share/wallpapers/cachyos-wallpapers/Abstract.png
    blur_passes    = 2
    blur_size      = 6
    brightness     = 0.7
    contrast       = 0.9
    vibrancy       = 0.17
}

label {
    monitor    =
    text       = cmd[update:1000] date +"%H:%M"
    color      = rgba(221, 221, 221, 1.0)
    font_size  = 110
    font_family = JetBrainsMono Nerd Font ExtraBold
    position   = 0, 220
    halign     = center
    valign     = center
}

label {
    monitor     =
    text        = cmd[update:60000] date +"%A, %d %B"
    color       = rgba(130, 220, 204, 1.0)
    font_size   = 22
    font_family = JetBrainsMono Nerd Font
    position    = 0, 130
    halign      = center
    valign      = center
}

label {
    monitor     =
    text        = cmd[update:30000] cat /sys/class/power_supply/BAT0/capacity | sed 's/$/%/'
    color       = rgba(121, 139, 178, 1.0)
    font_size   = 15
    font_family = JetBrainsMono Nerd Font
    position    = 0, -40
    halign      = center
    valign      = top
}

input-field {
    monitor         =
    size            = 320, 52
    outline_thickness = 2
    dots_size       = 0.28
    dots_spacing    = 0.3
    dots_center     = true
    outer_color     = rgba(24, 37, 69, 1.0)
    inner_color     = rgba(17, 24, 38, 0.9)
    font_color      = rgba(221, 221, 221, 1.0)
    fade_on_empty   = false
    placeholder_text = <span foreground="##798bb2">Password…</span>
    check_color     = rgba(1, 204, 255, 1.0)
    fail_color      = rgba(255, 85, 85, 1.0)
    fail_text       = <span foreground="##dddddd">$FAIL ($ATTEMPTS)</span>
    capslock_color  = rgba(240, 198, 116, 1.0)
    rounding        = 10
    position        = 0, -30
    halign          = center
    valign          = center
}

label {
    monitor     =
    text        = $USER
    color       = rgba(121, 139, 178, 1.0)
    font_size   = 14
    font_family = JetBrainsMono Nerd Font
    position    = 0, 40
    halign      = center
    valign      = center
}
