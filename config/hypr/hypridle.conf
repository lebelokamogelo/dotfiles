# NOTE: this Hyprland is configured in Lua, so `hyprctl dispatch` evaluates its
# argument as Lua -- the classic `hyprctl dispatch dpms off` form dies with
#   error: [string "return hl.dispatch(dpms off)"]:1: ')' expected near 'off'
# and hypridle silently swallows the failure. Every dispatch below must use the
# Lua call form.

general {
    lock_cmd        = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms("on")'
    ignore_dbus_inhibit = false
}

listener {
    timeout    = 240
    on-timeout = brightnessctl -s set 10%
    on-resume  = brightnessctl -r
}

listener {
    timeout    = 360
    on-timeout = loginctl lock-session
}

listener {
    timeout    = 420
    on-timeout = hyprctl dispatch 'hl.dsp.dpms("off")'
    on-resume  = hyprctl dispatch 'hl.dsp.dpms("on")'
}

listener {
    timeout    = 1800
    on-timeout = systemctl suspend
}
